# ============================================================
# 企业级 Python 平台 Docker Compose 编排
# ------------------------------------------------------------
# 所有敏感配置通过 .env 文件注入，不在编排文件中硬编码密码。
# 使用方式（在项目根目录执行）：
#   docker compose --env-file .env -f docker/docker-compose.yml up -d
# 启用 Nginx（可选）：
#   docker compose --env-file .env -f docker/docker-compose.yml --profile nginx up -d
# ============================================================
version: "3.9"

services:
  # ---------- FastAPI 应用服务 ----------
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: enterprise_app
    env_file:
      - ../.env
    environment:
      # 覆盖为容器网络内服务地址（.env 中的 localhost 值不适用于容器间通信）
      - DATABASE_URL=mysql+aiomysql://${MYSQL_USER:-app_user}:${MYSQL_PASSWORD:-password}@mysql:3306/${MYSQL_DATABASE:-enterprise_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis
    restart: unless-stopped
    networks:
      - enterprise_net

  # ---------- MySQL 数据库服务 ----------
  mysql:
    image: mysql:8.0
    container_name: enterprise_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-enterprise_db}
      MYSQL_USER: ${MYSQL_USER:-app_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    networks:
      - enterprise_net

  # ---------- Redis 缓存服务 ----------
  redis:
    image: redis:7
    container_name: enterprise_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - enterprise_net

  # ---------- Celery Worker 任务消费者 ----------
  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: enterprise_celery_worker
    command: celery -A app.tasks.celery_app:celery_app worker --loglevel=info
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=mysql+aiomysql://${MYSQL_USER:-app_user}:${MYSQL_PASSWORD:-password}@mysql:3306/${MYSQL_DATABASE:-enterprise_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      - app
      - redis
    restart: unless-stopped
    networks:
      - enterprise_net

  # ---------- Celery Beat 定时任务调度 ----------
  celery_beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: enterprise_celery_beat
    command: celery -A app.tasks.celery_app:celery_app beat --loglevel=info
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      - celery_worker
    restart: unless-stopped
    networks:
      - enterprise_net

  # ---------- Nginx 反向代理（可选，需 --profile nginx 启用） ----------
  nginx:
    image: nginx:latest
    container_name: enterprise_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - enterprise_net
    profiles:
      - nginx

volumes:
  mysql_data:
  redis_data:

networks:
  enterprise_net:
    driver: bridge
