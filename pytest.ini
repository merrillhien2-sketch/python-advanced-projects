[pytest]
# pytest-asyncio 配置：自动模式，无需手动标记 @pytest.mark.asyncio
asyncio_mode = auto

# 测试文件发现路径
testpaths = tests

# 测试文件匹配模式
python_files = test_*.py

# 测试函数匹配模式
python_functions = test_*

# 测试类匹配模式
python_classes = Test*

# 警告过滤器
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
